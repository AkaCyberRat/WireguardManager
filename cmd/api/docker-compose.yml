version: '3.2'

services:
  wireguard_manager:
    image: akacyberrat/wireguard_manager

    build:
      context: ../../
      dockerfile: deploy/Dockerfile
      args:
        - CMD_PATH=cmd/api
        - CMD_NAME=main.go

    container_name: wireguard_manager
    
    ports:
      - "51820:51820/udp"
      - "5000:5000"
    
    volumes:
      - wireguard_manager_db:/app/db/
      - wireguard_manager_log:/app/log/
      
    env_file:
      - config.example.env

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

volumes:
  wireguard_manager_db:
  wireguard_manager_log: 